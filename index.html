<!doctype html>
<html lang="fr" data-theme="auto">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#f3f5fa" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#0e131c" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="BIA 2027">
<meta name="description" content="Planning de révision pour le Brevet d'Initiation Aéronautique — session mai 2027">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" sizes="32x32" href="favicon-32.png">
<title>BIA 2027 — révision</title>
<style>
  :root{
    --bg:#eef1f6; --surface:#ffffff; --surface-2:#f6f8fb; --surface-3:#eef2f7;
    --text:#161c27; --muted:#5c6675; --faint:#8a94a3;
    --border:#e2e7ee; --border-strong:#d3d9e2;
    --accent:#2f6df0; --accent-ink:#ffffff; --accent-soft:#e7effe;
    --good:#128a5b; --good-soft:#dcf3e9;
    --warn:#c9781a; --warn-soft:#fbeede;
    --bad:#c23b22; --bad-soft:#f7e4e0;
    --p1:#2f6df0; --p2:#8a5cf6; --p3:#0e9488; --exam:#c23b22;
    --shadow:0 1px 2px rgba(19,28,45,.06),0 8px 24px rgba(19,28,45,.07);
    --radius:16px;
    --font:-apple-system,BlinkMacSystemFont,"SF Pro Text","Segoe UI",Roboto,Helvetica,Arial,sans-serif;
    --mono:"SF Mono",ui-monospace,Menlo,Consolas,monospace;
  }
  :root[data-theme="dark"]{
    --bg:#0e131c; --surface:#161d29; --surface-2:#1c2533; --surface-3:#212c3c;
    --text:#eaeef5; --muted:#9aa5b4; --faint:#6f7b8c;
    --border:#26303f; --border-strong:#313d4f;
    --accent:#5b93ff; --accent-ink:#0b1220; --accent-soft:#1b2742;
    --good:#3ecf8e; --good-soft:#123528;
    --warn:#e0a458; --warn-soft:#3a2c17;
    --bad:#ef7a63; --bad-soft:#3a2018;
    --p1:#5b93ff; --p2:#a689fb; --p3:#3fc7bb; --exam:#ef7a63;
    --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
  }
  @media (prefers-color-scheme:dark){
    :root[data-theme="auto"]{
      --bg:#0e131c; --surface:#161d29; --surface-2:#1c2533; --surface-3:#212c3c;
      --text:#eaeef5; --muted:#9aa5b4; --faint:#6f7b8c;
      --border:#26303f; --border-strong:#313d4f;
      --accent:#5b93ff; --accent-ink:#0b1220; --accent-soft:#1b2742;
      --good:#3ecf8e; --good-soft:#123528;
      --warn:#e0a458; --warn-soft:#3a2c17;
      --bad:#ef7a63; --bad-soft:#3a2018;
      --p1:#5b93ff; --p2:#a689fb; --p3:#3fc7bb; --exam:#ef7a63;
      --shadow:0 1px 2px rgba(0,0,0,.3),0 10px 30px rgba(0,0,0,.35);
    }
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{
    font-family:var(--font);background:var(--bg);color:var(--text);
    line-height:1.5;-webkit-font-smoothing:antialiased;
    padding-bottom:96px;
  }
  a{color:var(--accent)}
  button{font-family:var(--font)}

  .wrap{max-width:760px;margin:0 auto;padding:0 18px}

  /* ---------- app bar ---------- */
  .appbar{
    position:sticky;top:0;z-index:20;
    background:color-mix(in srgb,var(--surface) 82%,transparent);
    -webkit-backdrop-filter:saturate(180%) blur(16px);
    backdrop-filter:saturate(180%) blur(16px);
    border-bottom:1px solid var(--border);
  }
  .appbar-inner{
    max-width:760px;margin:0 auto;padding:13px 18px 12px;
    display:flex;align-items:baseline;justify-content:space-between;gap:12px;
  }
  .appbar h1{font-size:1.12rem;font-weight:750;letter-spacing:.2px;display:flex;align-items:center;gap:8px}
  .appbar .ctx{font-size:.82rem;color:var(--muted);font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap}

  main{max-width:760px;margin:0 auto;padding:18px}

  /* ---------- generic ---------- */
  .card{
    background:var(--surface);border:1px solid var(--border);border-radius:var(--radius);
    box-shadow:var(--shadow);overflow:hidden;
  }
  .stack{display:flex;flex-direction:column;gap:14px}
  .sec-title{font-size:.74rem;font-weight:700;letter-spacing:.6px;text-transform:uppercase;color:var(--faint);margin:6px 2px 2px}

  .track{height:8px;border-radius:99px;background:var(--surface-2);overflow:hidden;border:1px solid var(--border)}
  .fill{height:100%;width:0;background:var(--accent);border-radius:99px;transition:width .5s cubic-bezier(.2,.7,.2,1)}

  /* ---------- Planning tab ---------- */
  .phase{margin-bottom:28px}
  .phase-head{display:flex;align-items:flex-start;gap:12px;margin-bottom:4px}
  .phase-num{flex:none;width:28px;height:28px;border-radius:9px;background:var(--accent);color:var(--accent-ink);font-weight:750;display:grid;place-items:center;font-size:.88rem;margin-top:2px}
  .phase-head h2{font-size:1.1rem;font-weight:730}
  .phase-head p{color:var(--muted);font-size:.83rem;margin-top:1px}

  .chap{margin-top:11px}
  .chap-head{display:flex;flex-direction:column;gap:8px;padding:13px 15px;cursor:pointer;user-select:none;-webkit-user-select:none}
  .chap-head-top{display:flex;align-items:center;gap:10px}
  .cnum{flex:none;font-size:.7rem;font-weight:750;color:var(--accent);background:var(--accent-soft);border-radius:7px;padding:3px 7px;letter-spacing:.4px}
  .ctitle{flex:1;font-weight:670;font-size:.93rem;line-height:1.34}
  .chev{color:var(--faint);transition:transform .2s ease;flex:none;font-size:1.15rem;line-height:1}
  .chap.open .chev{transform:rotate(90deg)}
  .chap-head-meta{display:flex;align-items:center;gap:8px}
  .cmonth{font-size:.74rem;color:var(--faint);font-weight:600}
  .cprog{margin-left:auto;font-size:.76rem;color:var(--muted);font-weight:700;font-variant-numeric:tabular-nums;background:var(--surface-2);border:1px solid var(--border);padding:2px 9px;border-radius:99px}
  .chap-body{display:none;border-top:1px solid var(--border);padding:6px 4px 8px}
  .chap.open .chap-body{display:block}
  .part-label{font-size:.72rem;font-weight:700;letter-spacing:.5px;text-transform:uppercase;color:var(--faint);padding:12px 14px 5px}
  .row{display:flex;align-items:center;gap:12px;padding:9px 14px;border-radius:10px;transition:background .15s ease}
  .row:hover{background:var(--surface-2)}
  .check{flex:none;width:22px;height:22px;border-radius:7px;border:2px solid var(--border-strong);background:var(--surface);cursor:pointer;display:grid;place-items:center;transition:background .15s ease,border-color .15s ease,transform .1s ease}
  .check:active{transform:scale(.85)}
  .check svg{width:13px;height:13px;stroke:var(--accent-ink);stroke-width:3.5;fill:none;stroke-linecap:round;stroke-linejoin:round;opacity:0;transform:scale(.4);transition:opacity .15s ease,transform .15s ease}
  .row.checked .check{background:var(--good);border-color:var(--good)}
  .row.checked .check svg{opacity:1;transform:scale(1)}
  .row .txt{flex:1;font-size:.9rem}
  .row.checked .txt{color:var(--muted);text-decoration:line-through;text-decoration-color:var(--border-strong)}
  .flag{flex:none;border:0;background:transparent;cursor:pointer;font-size:1rem;color:var(--faint);opacity:.5;padding:4px;line-height:1;transition:opacity .15s ease,transform .1s ease,color .15s ease}
  .flag:active{transform:scale(.8)}
  .flag.on{opacity:1;color:var(--warn)}

  .task{display:flex;align-items:center;gap:12px;padding:11px 15px;border-top:1px solid var(--border)}
  .task:first-child{border-top:0}
  .task .tmain{flex:1}
  .task .tt{font-weight:640;font-size:.9rem}
  .task .td{color:var(--muted);font-size:.77rem;margin-top:1px}
  .subchecks{display:flex;gap:7px;flex-wrap:wrap;margin-top:8px}
  .chip{display:inline-flex;align-items:center;gap:6px;font-size:.75rem;font-weight:650;padding:5px 10px;border-radius:99px;border:1px solid var(--border-strong);background:var(--surface);color:var(--muted);cursor:pointer;user-select:none;-webkit-user-select:none;transition:all .15s ease}
  .chip:active{transform:scale(.94)}
  .chip.on{background:var(--good-soft);border-color:var(--good);color:var(--good)}
  .score-in{width:78px;font-family:var(--font);font-size:.82rem;font-weight:650;border:1px solid var(--border-strong);border-radius:9px;padding:6px 8px;background:var(--surface);color:var(--text)}
  .score-in::placeholder{color:var(--faint);font-weight:500}

  .weakbox{margin-top:12px;background:var(--warn-soft);border:1px solid var(--warn);border-radius:13px;padding:12px 14px}
  .weakbox h3{font-size:.8rem;text-transform:uppercase;letter-spacing:.6px;color:var(--warn);margin-bottom:6px}
  .weakbox ul{list-style:none;display:flex;flex-direction:column;gap:4px}
  .weakbox li{font-size:.85rem;display:flex;gap:8px}
  .weakbox li::before{content:"★";color:var(--warn);flex:none}
  .weakbox .empty{font-size:.83rem;color:var(--muted)}

  details.method{margin-top:14px;background:var(--surface);border:1px solid var(--border);border-radius:13px;box-shadow:var(--shadow)}
  details.method summary{padding:13px 15px;font-weight:670;font-size:.9rem;cursor:pointer;list-style:none}
  details.method summary::-webkit-details-marker{display:none}
  details.method summary::before{content:"▸ ";color:var(--faint)}
  details.method[open] summary::before{content:"▾ "}
  details.method .m-body{padding:0 15px 15px;font-size:.86rem;color:var(--muted)}
  details.method .m-body p{margin-top:9px}
  details.method .m-body strong{color:var(--text)}

  /* ---------- Dashboard tab ---------- */
  .hero{padding:18px 17px}
  .hero .big{font-size:2rem;font-weight:800;letter-spacing:.3px;line-height:1}
  .hero .sub{color:var(--muted);font-size:.84rem;margin-top:6px}
  .statgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
  @media (max-width:460px){.statgrid{grid-template-columns:1fr}}
  .stat{background:var(--surface);border:1px solid var(--border);border-radius:13px;padding:13px 14px;box-shadow:var(--shadow)}
  .stat .lbl{font-size:.7rem;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);font-weight:650}
  .stat .val{font-size:1.5rem;font-weight:770;margin:4px 0 2px;font-variant-numeric:tabular-nums}
  .stat .hint{font-size:.76rem;color:var(--muted)}
  .stat .track{margin-top:9px}
  .delta-pill{display:inline-flex;align-items:center;gap:6px;font-weight:700;font-size:.82rem;padding:4px 10px;border-radius:99px}
  .delta-pill.ahead{background:var(--good-soft);color:var(--good)}
  .delta-pill.behind{background:var(--bad-soft);color:var(--bad)}
  .delta-pill.ontrack{background:var(--accent-soft);color:var(--accent)}
  .mini-rows{display:flex;flex-direction:column;gap:10px}
  .mini{display:flex;align-items:center;gap:10px;font-size:.82rem}
  .mini .mlbl{flex:none;width:118px;color:var(--muted);font-weight:600}
  .mini .track{flex:1}
  .mini .mval{flex:none;font-weight:700;font-variant-numeric:tabular-nums;color:var(--muted);width:52px;text-align:right}

  /* ---------- Calendar tab ---------- */
  .cal-headline{padding:16px 16px}
  .cal-headline .k{font-size:.72rem;text-transform:uppercase;letter-spacing:.6px;color:var(--faint);font-weight:700}
  .cal-headline .v{font-size:1.15rem;font-weight:760;margin:5px 0 3px}
  .cal-headline .d{font-size:.82rem;color:var(--muted)}
  .cal-nav{display:flex;align-items:center;justify-content:space-between;padding:12px 14px;border-bottom:1px solid var(--border)}
  .cal-nav b{font-size:.98rem;font-weight:730;text-transform:capitalize}
  .cal-nav button{border:1px solid var(--border-strong);background:var(--surface);color:var(--text);width:34px;height:34px;border-radius:10px;font-size:1rem;cursor:pointer}
  .cal-nav button:active{transform:scale(.92)}
  .cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:3px;padding:10px}
  .cal-dow{text-align:center;font-size:.66rem;font-weight:750;color:var(--faint);text-transform:uppercase;letter-spacing:.4px;padding:4px 0}
  .cal-cell{aspect-ratio:1/1;border-radius:9px;border:1px solid transparent;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;font-size:.82rem;font-weight:600;cursor:pointer;position:relative;background:var(--surface-2);color:var(--text)}
  .cal-cell.blank{background:transparent;cursor:default}
  .cal-cell.p1{background:color-mix(in srgb,var(--p1) 13%,var(--surface))}
  .cal-cell.p2{background:color-mix(in srgb,var(--p2) 14%,var(--surface))}
  .cal-cell.p3{background:color-mix(in srgb,var(--p3) 15%,var(--surface))}
  .cal-cell.exam{background:var(--exam);color:#fff}
  .cal-cell.vac{outline:2px dashed color-mix(in srgb,var(--warn) 55%,transparent);outline-offset:-3px}
  .cal-cell.today{border-color:var(--text);box-shadow:0 0 0 1px var(--text) inset}
  .cal-cell.sel{border-color:var(--accent);box-shadow:0 0 0 2px var(--accent) inset}
  .cal-cell .dot{width:5px;height:5px;border-radius:50%;background:currentColor;opacity:.55}
  .cal-cell .mk{font-size:.7rem;line-height:1}
  .cal-legend{display:flex;flex-wrap:wrap;gap:10px 14px;padding:4px 16px 16px;font-size:.74rem;color:var(--muted)}
  .cal-legend span{display:inline-flex;align-items:center;gap:6px}
  .cal-legend i{width:12px;height:12px;border-radius:4px;display:inline-block}
  .cal-detail{padding:14px 16px;border-top:1px solid var(--border);font-size:.86rem}
  .cal-detail .dt{font-weight:730;margin-bottom:4px}
  .cal-detail .dl{color:var(--muted)}
  .cal-detail .dl b{color:var(--text)}

  /* ---------- Questions tab ---------- */
  .qmode{display:flex;gap:0;border:1px solid var(--border-strong);border-radius:11px;overflow:hidden;margin-bottom:14px}
  .qmode button{flex:1;border:0;background:var(--surface);color:var(--muted);font-size:.82rem;font-weight:670;padding:9px 8px;cursor:pointer}
  .qmode button.on{background:var(--accent);color:var(--accent-ink)}
  .quiz-lock{padding:22px 18px;text-align:center}
  .quiz-lock .ico{font-size:1.8rem}
  .quiz-lock h3{font-size:1.05rem;font-weight:740;margin:8px 0 6px}
  .quiz-lock p{color:var(--muted);font-size:.88rem;margin-bottom:14px}
  .quiz-lock button, .quiz-intro button.go{border:0;background:var(--accent);color:var(--accent-ink);font-size:.9rem;font-weight:700;padding:11px 20px;border-radius:11px;cursor:pointer}
  .quiz-intro{padding:18px 17px}
  .quiz-intro h3{font-size:1.1rem;font-weight:750;margin-bottom:5px}
  .quiz-intro p{color:var(--muted);font-size:.86rem;margin-bottom:6px}
  .quiz-intro .from{display:flex;flex-wrap:wrap;gap:6px;margin:10px 0 16px}
  .quiz-intro .from span{font-size:.74rem;font-weight:650;background:var(--surface-2);border:1px solid var(--border);color:var(--muted);padding:4px 9px;border-radius:99px}
  .quiz-bar{display:flex;align-items:center;gap:10px;padding:13px 15px}
  .quiz-bar .qt{font-weight:740;font-size:.96rem}
  .quiz-bar .qs{margin-left:auto;font-weight:750;font-variant-numeric:tabular-nums;color:var(--muted)}
  .quiz-result{padding:20px 18px;text-align:center}
  .quiz-result .big{font-size:2.1rem;font-weight:820}
  .quiz-result .msg{font-size:.95rem;font-weight:650;margin:4px 0 4px}
  .quiz-result .sub{color:var(--muted);font-size:.83rem;margin-bottom:16px}
  .quiz-result .acts{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
  .quiz-result button{border:1px solid var(--border-strong);background:var(--surface);color:var(--text);font-size:.84rem;font-weight:660;padding:9px 16px;border-radius:10px;cursor:pointer}
  .quiz-result button.primary{border-color:var(--accent);background:var(--accent);color:var(--accent-ink)}
  .qtag{font-family:var(--mono);font-size:.66rem;letter-spacing:.06em;text-transform:uppercase;color:var(--faint);font-weight:600;padding:0 15px 2px}
  .ep-pills{display:flex;gap:6px;overflow-x:auto;padding:4px 0 10px;scrollbar-width:none}
  .ep-pills::-webkit-scrollbar{display:none}
  .ep-pill{flex:0 0 auto;font-size:.78rem;font-weight:670;padding:8px 12px;border-radius:10px;border:1px solid var(--border-strong);background:var(--surface);color:var(--muted);cursor:pointer;white-space:nowrap}
  .ep-pill.active{background:var(--accent);color:var(--accent-ink);border-color:var(--accent)}
  .ep-head{padding:15px 16px}
  .ep-head .eb{font-family:var(--mono);font-size:.7rem;letter-spacing:.14em;text-transform:uppercase;color:var(--accent);font-weight:600}
  .ep-head h2{font-size:1.16rem;font-weight:750;margin:5px 0 6px;line-height:1.15}
  .ep-head p{color:var(--muted);font-size:.86rem}
  .panel{margin:12px 0;border-radius:13px;padding:14px 15px;border:1px solid var(--border)}
  .panel.fiche{background:var(--surface);border-left:3px solid var(--accent)}
  .panel.pieges{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
  .panel h3{font-family:var(--mono);font-size:.7rem;font-weight:600;letter-spacing:.14em;text-transform:uppercase;margin-bottom:9px}
  .panel.fiche h3{color:var(--accent)}
  .panel.pieges h3{color:var(--warn)}
  .panel ul{list-style:none;display:flex;flex-direction:column;gap:7px}
  .panel li{font-size:.86rem;padding-left:17px;position:relative;color:var(--muted)}
  .panel.fiche li::before{content:"›";position:absolute;left:2px;color:var(--accent);font-weight:700}
  .panel.pieges li::before{content:"✕";position:absolute;left:2px;color:var(--warn);font-size:.8em;top:.15em}
  .panel li b{color:var(--text);font-weight:600}
  .panel li .num{font-family:var(--mono);color:var(--text);font-weight:500;font-size:.92em}
  .q-tools{display:flex;gap:8px;align-items:center;margin:14px 0 12px;flex-wrap:wrap}
  .q-tools .count{font-family:var(--mono);font-size:.74rem;color:var(--faint);margin-right:auto}
  .q-tools .count b{color:var(--good)}
  button.tool{font-family:var(--mono);font-size:.74rem;background:var(--surface);color:var(--muted);border:1px solid var(--border-strong);border-radius:8px;padding:6px 11px;cursor:pointer}
  button.tool:active{transform:scale(.96)}
  .qlist{display:flex;flex-direction:column;gap:11px}
  .q{border:1px solid var(--border);border-radius:12px;background:var(--surface);overflow:hidden}
  .q-stem{padding:13px 15px 11px;font-weight:500;font-size:.95rem;display:flex;gap:9px}
  .q-stem .qn{font-family:var(--mono);font-size:.8rem;color:var(--accent);font-weight:600;flex:none;padding-top:.1em}
  .q-opts{list-style:none;display:flex;flex-direction:column;gap:1px;background:var(--border);border-top:1px solid var(--border)}
  .q-opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--surface);color:var(--text);border:0;padding:11px 15px;font:inherit;font-size:.9rem;cursor:pointer;line-height:1.45}
  .q-opt:active{background:var(--surface-2)}
  .q-opt .k{font-family:var(--mono);font-weight:500;color:var(--faint);flex:none}
  .q.revealed .q-opt{cursor:default}
  .q.revealed .q-opt.correct{background:var(--good-soft)}
  .q.revealed .q-opt.correct .k{color:var(--good);font-weight:700}
  .q.revealed .q-opt.correct::after{content:"✓";margin-left:auto;color:var(--good);font-weight:700}
  .q.revealed .q-opt.chosen.wrong{background:var(--bad-soft)}
  .q.revealed .q-opt.chosen.wrong .k{color:var(--bad);font-weight:700}
  .q.revealed .q-opt.chosen.wrong::after{content:"✕";margin-left:auto;color:var(--bad);font-weight:700}
  .q-why{display:none;padding:11px 15px;background:var(--accent-soft);font-size:.85rem;color:var(--muted);border-top:1px solid var(--border)}
  .q-why b{color:var(--text);font-weight:600}
  .q.revealed .q-why{display:block}

  /* ---------- Réglages tab ---------- */
  .set-row{display:flex;align-items:center;justify-content:space-between;gap:10px 14px;padding:14px 15px;border-top:1px solid var(--border);flex-wrap:wrap}
  .set-row:first-child{border-top:0}
  .set-row>div:first-child{flex:1 1 55%;min-width:180px}
  .set-row .sl{font-weight:640;font-size:.9rem}
  .set-row .sd{font-size:.77rem;color:var(--muted);margin-top:1px}
  .set-row a{white-space:nowrap}
  .seg{display:inline-flex;border:1px solid var(--border-strong);border-radius:10px;overflow:hidden;flex:0 0 auto}
  .seg button{border:0;background:var(--surface);color:var(--muted);font-size:.78rem;font-weight:650;padding:7px 13px;cursor:pointer}

    return [done,tot];
  }
  function p2Counts(){ var d=0,t=0; PHASE2.forEach(function(it,i){ if(it.single){t++;if(state.p2[i+"-0"])d++;} else P2SUB.forEach(function(_,j){t++;if(state.p2[i+"-"+j])d++;}); }); return [d,t]; }
  function p3Counts(){ var d=0; PHASE3.forEach(function(_,i){ if(state.p3[i]) d++; }); return [d,PHASE3.length]; }
  function weakList(){
    var out=[];
    PLAN.forEach(function(chap,ci){ chap.parts.forEach(function(part,pi){ part.items.forEach(function(name,ii){
      if(state.weak[secId(ci,pi,ii)]) out.push(chap.n.replace("Chapitre ","Ch. ")+" — "+name);
    }); }); });
    return out;
  }
  function qcmPartStats(p){
    var faites=0,justes=0;
    p.questions.forEach(function(_,i){
      var v=state.qcm[p.id+"."+i];
      if(v!==undefined){ faites++; if(v===p.questions[i].c) justes++; }
    });
    return {faites:faites,justes:justes,total:p.questions.length};
  }
  function qcmGlobal(){
    var f=0,j=0,t=0;
    QCM.forEach(function(p){ var s=qcmPartStats(p); f+=s.faites; j+=s.justes; t+=s.total; });
    return {faites:f,justes:j,total:t};
  }

  /* ================= quiz du jour ================= */
  function todayISO(){
    try{ return new Date().toLocaleDateString("fr-CA",{timeZone:"Europe/Paris"}); }
    catch(e){ var d=new Date(); return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate()); }
  }
  function isoOf(dt){ return dt.getFullYear()+"-"+pad2(dt.getMonth()+1)+"-"+pad2(dt.getDate()); }
  // marque le jour comme "travaillé" (section cochée ou question de quiz répondue)
  function markActive(){ var t=todayISO(); if(!state.act[t]){ state.act[t]=1; save(); } }
  function isoToUTC(iso){ var p=(iso||"").split("-"); return Date.UTC(+p[0], (+p[1]||1)-1, +p[2]||1); }
  function daysAgoISO(iso){
    if(!iso) return 999;
    return Math.round((isoToUTC(todayISO()) - isoToUTC(iso)) / 86400000);
  }
  // index de chapitre PLAN -> id d'épreuve QCM
  var CHAP2EP = { 0:"aero", 1:"aeronefs", 2:"meteo", 3:"nav", 4:"histoire" };
  // épreuves « débloquées » = chapitres où au moins une section est cochée.
  // rien coché → tableau vide → pas de quiz.
  function activeEpIds(){
    var seen = {};
    for(var k in state.sec){ if(state.sec[k]) seen[k.split(".")[0]] = 1; }
    return Object.keys(seen).map(function(ci){ return CHAP2EP[ci]; }).filter(Boolean);
  }
  function workedChapNames(){
    var seen = {};
    for(var k in state.sec){ if(state.sec[k]) seen[k.split(".")[0]] = 1; }
    return Object.keys(seen).map(function(ci){ return PLAN[ci] ? PLAN[ci].title : null; }).filter(Boolean);
  }
  // lance un quiz à la demande (indépendant du « rappel du matin »)
  function launchQuiz(){
    var qids = pickDailyQuiz();
    if(!qids.length) return false;
    state.daily = { date: todayISO(), qids: qids, done:false };
    state.tab = "dailyquiz";
    save(); render();
    return true;
  }
  function qById(qid){
    var pa = qid.split("."), p = QCM.find(function(x){ return x.id===pa[0]; });
    return p ? p.questions[+pa[1]] : null;
  }
  // choisit 5 qid, priorité : jamais faites > ratées > vues il y a longtemps
  function pickDailyQuiz(){
    var eps = activeEpIds();
    var A=[], B=[], C=[], all=[];
    QCM.forEach(function(p){
      if(eps.indexOf(p.id) < 0) return;
      p.questions.forEach(function(q,i){
        var qid = p.id+"."+i, v = state.qcm[qid];
        all.push(qid);
        if(daysAgoISO(state.qcmAt[qid]) <= 1) return;           // pas revoir ce qu'on vient de faire
        if(v===undefined || v===-1) A.push(qid);
        else if(v !== q.c) B.push(qid);
        else if(daysAgoISO(state.qcmAt[qid]) >= 6) C.push(qid);
      });
    });
    function shuf(a){ for(var i=a.length-1;i>0;i--){ var j=(Math.random()*(i+1))|0; var t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
    shuf(A); shuf(B); shuf(C); shuf(all);
    var pick = [];
    function take(arr,n){ for(var i=0;i<arr.length && pick.length<5 && n>0;i++){ if(pick.indexOf(arr[i])<0){ pick.push(arr[i]); n--; } } }
    take(A,3); take(B,1); take(C,1); take(A,5); take(C,5); take(B,5); take(all,5);
    return pick.slice(0,5);
  }
  function ensureDailyQuiz(){
    if(!state.dailyOn) return;
    var t = todayISO();
    if(state.daily && state.daily.date === t) return;   // déjà un quiz pour aujourd'hui (local ou routine)
    var qids = pickDailyQuiz();
    if(!qids.length) return;
    state.daily = { date:t, qids:qids, done:false };
    save();
  }
  function dailyPending(){
    return !!(state.dailyOn && state.daily && state.daily.date === todayISO() && !state.daily.done);
  }
  function dailyScore(){
    if(!state.daily) return 0;
    var n=0;
    state.daily.qids.forEach(function(qid){
      var q = qById(qid); if(q && state.qcm[qid]!==undefined && state.qcm[qid]!==-1 && state.qcm[qid]===q.c) n++;
    });
    return n;
  }
  function fmtDelta(x){ return (x>0?"+":"")+x; }
  function plur(n,s,p){ return (Math.abs(n)>1) ? (p||(s+"s")) : s; }
  function cap(str){ return str.charAt(0).toUpperCase()+str.slice(1); }
  function daysToExam(){ return daysBetween(new Date(), EXAM); }
  function pad2(n){ return (n<10?"0":"")+n; }
  var MONTHS=["janvier","février","mars","avril","mai","juin","juillet","août","septembre","octobre","novembre","décembre"];
  var DOWS=["lundi","mardi","mercredi","jeudi","vendredi","samedi","dimanche"];

  function scheduleDelta(){
    var today=new Date();
    var actual=countSec();
    var exp=expectedSections(today);
    var deltaSec=Math.round(actual-exp);
    var sl=slopePerDay(today);
    var deltaDays = sl>0.02 ? Math.round(deltaSec/sl) : 0;
    var phase1Done = d0(today) > CURVE[CURVE.length-1][0];
    var beforeStart = d0(today) < CURVE[0][0];
    return {actual:actual, exp:exp, deltaSec:deltaSec, deltaDays:deltaDays, phase1Done:phase1Done, beforeStart:beforeStart};
  }
  function phaseOfDate(dt){
    var d=d0(dt), t=d.getTime();
    if (d.getTime()===d0(EXAM).getTime()) return "exam";
    if (t>=d0(new Date(2026,8,1)).getTime() && t<=d0(new Date(2027,1,10)).getTime()) return "p1";
    if (t>=d0(new Date(2027,1,16)).getTime() && t<=d0(new Date(2027,3,12)).getTime()) return "p2";
    if (t>=d0(new Date(2027,3,13)).getTime() && t<=d0(EXAM).getTime()) return "p3";
    return "off";
  }
  function vacOfDate(dt){
    var t=d0(dt).getTime();
    for(var i=0;i<VAC.length;i++){ if(t>=d0(VAC[i][0]).getTime() && t<=d0(VAC[i][1]).getTime()) return VAC[i][2]; }
    return null;
  }
  // un "jour de révision" = lundi→vendredi, dans une phase, hors vacances
  function isStudyDay(dt){
    var dow=(dt.getDay()+6)%7;
    return dow<=4 && phaseOfDate(dt)!=="off" && !vacOfDate(dt);
  }
  // jours actifs consécutifs : un jour travaillé compte toujours ; un jour de
  // révision manqué casse la série ; un week-end/vacances non travaillé est transparent.
  function activeStreak(){
    var d=new Date();
    if(!state.act[isoOf(d)]) d.setDate(d.getDate()-1);   // aujourd'hui pas encore fait → on part d'hier
    var s=0, guard=0;
    while(guard++<420){
      if(state.act[isoOf(d)]){ s++; d.setDate(d.getDate()-1); continue; }
      if(isStudyDay(d)) break;
      d.setDate(d.getDate()-1);
    }
    return s;
  }

  /* ================= RENDER : Calendrier ================= */
  var calY, calM, selDay=null;

  function renderCalDetail(cc,dt){
    var slot=cc.querySelector(".cal-detail-slot"); if(!slot) return;
    slot.innerHTML="";
    var d=el("div","cal-detail");
    var lbl=cap(DOWS[(dt.getDay()+6)%7])+" "+dt.getDate()+" "+MONTHS[dt.getMonth()]+" "+dt.getFullYear();
    d.appendChild(el("div","dt",lbl));
    var ph=phaseOfDate(dt), vac=vacOfDate(dt);
    var body="";
    if(d0(dt).getTime()===d0(EXAM).getTime()) body='<b>Jour J ✈️</b> — épreuve BIA, 2 h 30.';
    else if(d0(dt).getTime()===d0(READY).getTime()) body='<b>Objectif « prêt »</b> — à cette date, tout doit être révisé.';
    else if(vac) body='<b>'+vac+'</b> — tu souffles, ou tu prends de l’avance. Le planning en tient déjà compte.';
    else if(ph==="p1"){
      var exp=Math.round(expectedSections(dt));
      var wk=Math.max(0, Math.round(expectedSections(dt)-expectedSections(new Date(dt.getFullYear(),dt.getMonth(),dt.getDate()-7))));
      body='<b>Lecture 1</b> — objectif cumulé : <b>'+exp+' / 65</b> sections lues'+(wk?(' <span class="dl">(soit ~'+wk+' cette semaine)</span>'):'')+'.';
    }
    else if(ph==="p2"){
      var idx=Math.min(PHASE2.length-1, Math.floor((d0(dt)-d0(new Date(2027,1,16)))/(7*dayMs())));

        '<h3>Le quiz se débloque quand tu travailles</h3>'+
        '<p>Coche des sections dans le Planning au fil de tes lectures : le quiz te posera des questions uniquement sur ce que tu as vu.</p>'+
        '<button data-a="goplan">Aller au Planning</button></div>';

    } else {
      var chips=worked.map(function(id){ var p=QCM.find(function(x){return x.id===id;}); return p?p.nav:null; }).filter(Boolean);
      quizCard.innerHTML='<div class="quiz-intro"><h3>🎯 Quiz de révision</h3>'+
        '<p>5 questions tirées au hasard de ce que tu as coché dans le Planning. Priorité aux questions jamais faites et à tes erreurs.</p>'+
        '<div class="from">'+chips.map(function(n){ return '<span>'+n+'</span>'; }).join('')+'</div>'+
        '<button class="go" data-a="start">Lancer le quiz</button></div>';
      quizCard.querySelector('[data-a="start"]').addEventListener("click",launchQuiz);
    }
    host.appendChild(quizCard);
    host.appendChild(el("div","sec-title","Réviser par épreuve"));

    var pills=el("div","ep-pills");
    QCM.forEach(function(p,i){
      var s=qcmPartStats(p);
      var b=el("button","ep-pill"+(i===qcmPart?" active":""), p.nav+" · "+s.faites+"/"+s.total);
      b.addEventListener("click",function(){ qcmPart=i; render(); });
      pills.appendChild(b);
    });
    host.appendChild(pills);

    var p=QCM[qcmPart];
    var card=el("div","card"); card.style.marginBottom="14px";
    card.appendChild(el("div","ep-head",
      '<div class="eb">'+p.exam+' · '+p.manuel+'</div><h2>'+p.title+'</h2><p>'+p.intro+'</p>'));
    host.appendChild(card);

    var fiche=el("div","panel fiche","<h3>À savoir par cœur</h3><ul>"+p.fiche.map(function(x){return "<li>"+x+"</li>";}).join("")+"</ul>");
    host.appendChild(fiche);
    var pieges=el("div","panel pieges","<h3>Pièges classiques</h3><ul>"+p.pieges.map(function(x){return "<li>"+x+"</li>";}).join("")+"</ul>");
    host.appendChild(pieges);

    var st=qcmPartStats(p);
    var tools=el("div","q-tools");
    tools.innerHTML='<span class="count"><b>'+st.justes+'</b> '+plur(st.justes,"juste")+' / '+st.faites+' '+plur(st.faites,"faite")+' · '+st.total+' au total</span>'+
      '<button class="tool" data-a="show">Afficher les réponses</button>'+
      '<button class="tool" data-a="reset">Réinitialiser</button>';
    host.appendChild(tools);

    var list=el("div","qlist");
    p.questions.forEach(function(qd,i){
      var q=el("div","q");
      var stored=state.qcm[p.id+"."+i];
      var stem=el("div","q-stem",'<span class="qn">'+(i+1)+'</span><span>'+qd.q+'</span>');
      q.appendChild(stem);
      var ul=el("ul","q-opts");
      qd.o.forEach(function(opt,j){
        var li=el("li");
        var btn=el("button","q-opt"+(j===qd.c?" correct":""),'<span class="k">'+LETTERS[j]+'</span><span>'+opt+'</span>');
        btn.type="button";
        btn.addEventListener("click",function(){
          if(q.classList.contains("revealed")) return;
          state.qcm[p.id+"."+i]=j;
          state.qcmAt[p.id+"."+i]=todayISO();
          markActive();
          if(j!==qd.c) btn.classList.add("chosen","wrong");
          q.classList.add("revealed");
          save();
          refreshQTools(tools,p);
        });
        li.appendChild(btn); ul.appendChild(li);
      });
      q.appendChild(ul);
      q.appendChild(el("div","q-why",'<b>'+LETTERS[qd.c]+'.</b> '+qd.w));
      if(stored!==undefined){
        q.classList.add("revealed");
        var btns=ul.querySelectorAll(".q-opt");
        if(stored!==qd.c && btns[stored]) btns[stored].classList.add("chosen","wrong");
      }
      list.appendChild(q);
    });
    host.appendChild(list);

    tools.addEventListener("click",function(e){
      var b=e.target.closest("button"); if(!b) return;
      if(b.dataset.a==="show"){
        list.querySelectorAll(".q").forEach(function(q,i){
          q.classList.add("revealed");
          if(state.qcm[p.id+"."+i]===undefined){ state.qcm[p.id+"."+i]=-1; }
        });
        save(); refreshQTools(tools,p); refreshPills(pills);
      } else {
        p.questions.forEach(function(_,i){ delete state.qcm[p.id+"."+i]; });
        save(); render();
      }
    });
  }
  function refreshQTools(tools,p){
    var st=qcmPartStats(p);
    tools.querySelector(".count").innerHTML='<b>'+st.justes+'</b> '+plur(st.justes,"juste")+' / '+st.faites+' '+plur(st.faites,"faite")+' · '+st.total+' au total';
    var g=qcmGlobal(); setBar("Questions", g.justes+" / "+g.faites+" justes");
  }
  function refreshPills(pills){
    pills.querySelectorAll(".ep-pill").forEach(function(b,i){
      var s=qcmPartStats(QCM[i]); b.textContent=QCM[i].nav+" · "+s.faites+"/"+s.total;
      b.classList.toggle("active",i===qcmPart);
    });
  }

  /* ================= RENDER : Quiz du jour ================= */
  function goBackFromQuiz(){ state.tab = "planning"; save(); render(); }

  function renderDailyQuiz(host){
    setBar("Quiz", null);
    if(!state.daily){ ensureDailyQuiz(); }
    var d = state.daily;
    if(!d || !d.qids || !d.qids.length){
      var lock=el("div","card");
      if(!activeEpIds().length){
        lock.innerHTML='<div class="quiz-lock"><div class="ico">🔒</div>'+
          '<h3>Rien à réviser pour l’instant</h3>'+
          '<p>Le quiz porte sur ce que tu travailles. Lis une section dans le Planning et coche-la, puis reviens ici.</p>'+
          '<button data-a="goplan">Aller au Planning</button></div>';
        lock.querySelector('[data-a="goplan"]').addEventListener("click",goBackFromQuiz);
      } else {
        lock.innerHTML='<div class="quiz-lock"><div class="ico">🎯</div>'+
          '<h3>Prêt pour un quiz ?</h3>'+
          '<p>5 questions sur ce que tu as coché dans le Planning.</p>'+
          '<button data-a="start">Lancer le quiz</button></div>';
        lock.querySelector('[data-a="start"]').addEventListener("click",launchQuiz);
      }
      host.appendChild(lock);
      var bb=el("button","tool","‹ Retour"); bb.style.marginTop="12px"; bb.addEventListener("click",goBackFromQuiz);
      host.appendChild(bb); return;
    }

    var head=el("div","card"); head.style.marginBottom="14px";
    var done=0; d.qids.forEach(function(qid){ if(state.qcm[qid]!==undefined && state.qcm[qid]!==-1) done++; });
    var finished = done >= d.qids.length;
    var streakTxt = state.dailyOn ? (' · série '+state.dailyStreak+' '+plur(state.dailyStreak,"jour")) : '';
    head.appendChild(el("div","hero",
      '<div class="big">'+ (finished ? (dailyScore()+" / "+d.qids.length) : (done+" / "+d.qids.length)) +'</div>'+
      '<div class="sub">'+ (finished
        ? ('Quiz terminé — '+dailyScore()+' bonne'+plur(dailyScore(),"","s")+' réponse'+plur(dailyScore(),"","s")+' sur '+d.qids.length+'.'+streakTxt)
        : ('5 questions sur ce que tu as travaillé.'+streakTxt) ) +'</div>'));
    host.appendChild(head);

    var list=el("div","qlist");
    d.qids.forEach(function(qid,idx){
      var pa=qid.split("."), pid=pa[0], qi=+pa[1];
      var p=QCM.find(function(x){ return x.id===pid; }); if(!p) return;
      var qd=p.questions[qi];
      var q=el("div","q");
      q.appendChild(el("div","q-stem",'<span class="qn">'+(idx+1)+'</span><span>'+qd.q+'</span>'));
      var ul=el("ul","q-opts");
      var stored=state.qcm[qid];
      qd.o.forEach(function(opt,j){
        var li=el("li");
        var btn=el("button","q-opt"+(j===qd.c?" correct":""),'<span class="k">'+LETTERS[j]+'</span><span>'+opt+'</span>');
        btn.type="button";
        btn.addEventListener("click",function(){
          if(q.classList.contains("revealed")) return;
          state.qcm[qid]=j; state.qcmAt[qid]=todayISO();
          markActive();
          if(j!==qd.c) btn.classList.add("chosen","wrong");
          q.classList.add("revealed");
          // fini ?
          var d2=0; state.daily.qids.forEach(function(x){ if(state.qcm[x]!==undefined && state.qcm[x]!==-1) d2++; });
          if(d2 >= state.daily.qids.length && !state.daily.done){
            state.daily.done = true;
            var t = todayISO();
            if(state.dailyLast !== t){
              state.dailyStreak = (daysAgoISO(state.dailyLast) === 1) ? state.dailyStreak+1 : 1;
              state.dailyLast = t;
            }
          }
          save();
          render();
        });
        li.appendChild(btn); ul.appendChild(li);
      });
      q.appendChild(ul);
      q.appendChild(el("div","q-why",'<b>'+LETTERS[qd.c]+'.</b> '+qd.w+'  <span style="color:var(--faint)">— '+p.nav+'</span>'));
      if(stored!==undefined && stored!==-1){
        q.classList.add("revealed");
        var bs=ul.querySelectorAll(".q-opt");
        if(stored!==qd.c && bs[stored]) bs[stored].classList.add("chosen","wrong");
      }
      list.appendChild(q);
    });
    host.appendChild(list);

    var bar=el("div"); bar.style.cssText="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap";
    var back=el("button","tool", finished ? "Revenir au planning" : "‹ Retour");
    back.addEventListener("click",goBackFromQuiz);
    bar.appendChild(back);
    if(finished && activeEpIds().length){
      var again=el("button","tool","🎯 Nouveau quiz");
      again.addEventListener("click",function(){ state.daily=null; save(); launchQuiz(); });
      bar.appendChild(again);
    }
    host.appendChild(bar);
  }

    var nmsg=el("div","sd"); nmsg.style.marginTop="8px";
    nb.addEventListener("click",function(){
      nb.disabled=true; nmsg.textContent="…";
      if(state.dailyOn){
        disableDailyReminder(function(){ render(); });
      } else {
        enableDailyReminder(function(err){
          nb.disabled=false;
          if(err){ nmsg.textContent=err; }
          else { render(); }
        });
      }
    });
    nr.appendChild(nb); nr.appendChild(nmsg);
    if(state.dailyOn){
      var tq=el("button","btn-danger","Voir le quiz du jour");
      tq.style.cssText="border-color:var(--border-strong);color:var(--text);margin-top:8px;align-self:flex-start";
      tq.addEventListener("click",function(){ ensureDailyQuiz(); state.tab="dailyquiz"; save(); render(); });
      nr.appendChild(tq);
    }
    nc.appendChild(nr);
    host.appendChild(nc);

    /* ---- Synchro Mac ↔ iPad ---- */
    var sc=el("div","card"); sc.style.marginBottom="14px";
    var sr=el("div","set-row"); sr.style.flexDirection="column"; sr.style.alignItems="stretch";
    if(!syncCode){
      sr.innerHTML='<div><div class="sl">Synchro Mac ↔ iPad</div><div class="sd">Crée un code sur un appareil, saisis-le sur l’autre : planning, questions et réglages suivent partout.</div></div>';
      var mk=el("button","btn-danger","Créer un code"); mk.style.cssText="border-color:var(--accent);color:var(--accent);margin-top:10px;align-self:flex-start";
      mk.addEventListener("click",syncCreate);
      sr.appendChild(mk);
      var link=el("div"); link.style.cssText="display:flex;gap:8px;margin-top:10px;flex-wrap:wrap;align-items:center";
      var inp=el("input"); inp.type="text"; inp.maxLength=6; inp.placeholder="Coller un code";
      inp.style.cssText="font-family:var(--mono);font-size:.95rem;letter-spacing:.1em;text-transform:uppercase;padding:8px 11px;border-radius:8px;border:1px solid var(--border-strong);background:var(--bg);color:var(--text);width:150px";
      var lk=el("button","btn-danger","Relier"); lk.style.cssText="border-color:var(--border-strong);color:var(--text)";
      lk.addEventListener("click",function(){ syncLinkTo(inp.value); });
      link.appendChild(inp); link.appendChild(lk);
      sr.appendChild(link);
    } else {
      sr.innerHTML='<div><div class="sl">Synchro Mac ↔ iPad</div><div class="sd">Saisis ce code sur ton autre appareil.</div></div>';
      var codeRow=el("div"); codeRow.style.cssText="display:flex;align-items:center;gap:11px;margin-top:10px;flex-wrap:wrap";
      var codeEl=el("span",null,syncCode);
      codeEl.style.cssText="font-family:var(--mono);font-size:1.4rem;font-weight:800;letter-spacing:.14em;color:var(--accent);background:var(--accent-soft);padding:6px 14px;border-radius:9px";
      var cp=el("button","btn-danger","Copier"); cp.style.cssText="border-color:var(--border-strong);color:var(--text)";
      cp.addEventListener("click",function(){ if(navigator.clipboard) navigator.clipboard.writeText(syncCode).catch(function(){}); setSyncMsg("Code copié"); });
      codeRow.appendChild(codeEl); codeRow.appendChild(cp);
      sr.appendChild(codeRow);
      var stEl=el("div","sd"); stEl.id="syncStatus"; stEl.style.marginTop="9px"; stEl.textContent=syncMsg;
      sr.appendChild(stEl);
      var ul=el("button","btn-danger","Délier cet appareil"); ul.style.marginTop="8px"; ul.style.alignSelf="flex-start";
      ul.addEventListener("click",syncUnlink);
      sr.appendChild(ul);
    }
    sc.appendChild(sr);
    host.appendChild(sc);

    var rzc=el("div","card"); rzc.style.marginBottom="14px";
    var r4=el("div","set-row");
    r4.innerHTML='<div><div class="sl">Remise à zéro</div><div class="sd">Efface toute ta progression sur cet appareil</div></div>';
    var db=el("button","btn-danger","Tout effacer");
    db.addEventListener("click",function(){
      if(confirm("Remettre toute la progression à zéro ?"+(syncCode?" (aussi sur les appareils synchronisés)":""))){
        var th=state.theme;
        state={ sec:{}, weak:{}, p2:{}, p3:{}, score:{}, open:{}, qcm:{}, qcmAt:{}, theme:th, tab:"planning",
                subs:state.subs||[], dailyOn:state.dailyOn||false, daily:null, dailyStreak:0, dailyLast:"", act:{}, eveningLast:"" };
        try{ localStorage.setItem(KEY,JSON.stringify(state)); localStorage.removeItem(SYNC_SEEN_KEY); }catch(e){}
        if(sb&&syncCode){ sb.from(SYNC_TABLE).upsert({ code:syncCode, data:state }).then(function(){ location.reload(); }); }
        else location.reload();
      }
    });
    r4.appendChild(db);
    rzc.appendChild(r4);
    host.appendChild(rzc);

    host.appendChild(el("div",null,'<div style="font-size:.76rem;color:var(--faint);text-align:center;padding:8px 12px 0">'+
      'Progression enregistrée sur cet appareil (localStorage). Contenu basé sur le manuel officiel BIA (eduscol) et les sujets 2022–2025.</div>'));
  }

  /* ================= TAB BAR ================= */
  var ICON={
    planning:'<svg viewBox="0 0 24 24"><path d="M9 3h6a2 2 0 0 1 2 2v0H7v0a2 2 0 0 1 2-2z"/><rect x="4" y="5" width="16" height="16" rx="2"/><path d="M9 12l2 2 4-4"/></svg>',
    calendrier:'<svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="16" rx="2"/><path d="M3 10h18M8 3v4M16 3v4"/></svg>',
    questions:'<svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M9.5 9a2.5 2.5 0 1 1 3.6 2.2c-.7.4-1.1 1-1.1 1.8v.5"/><circle cx="12" cy="16.5" r=".6" fill="currentColor" stroke="none"/></svg>',
    dashboard:'<svg viewBox="0 0 24 24"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>',
    reglages:'<svg viewBox="0 0 24 24"><path d="M6 8h12M6 8a2 2 0 1 1 0 .01M6 16h12M14 16a2 2 0 1 1 .01 0"/></svg>'
  };
  var TABS=[["planning","Planning"],["calendrier","Calendrier"],["questions","Questions"],["dashboard","Dashboard"],["reglages","Réglages"]];
  var tabbarWired=false;
  function renderTabbar(){
    var tb=document.getElementById("tabbar");
    tb.innerHTML="";
    var inner=el("div","tabbar-inner");
    TABS.forEach(function(t){
      var b=el("button",state.tab===t[0]?"active":null, ICON[t[0]]+"<span>"+t[1]+"</span>");
      b.setAttribute("aria-label",t[1]);
      b.addEventListener("click",function(){
        b.classList.add("bounce"); setTimeout(function(){ b.classList.remove("bounce"); },260);
        if(state.tab!==t[0]){ state.tab=t[0]; save(); render(); }
      });
      inner.appendChild(b);
    });
    tb.appendChild(inner);
    inner.addEventListener("pointerdown",function(){ inner.classList.add("pressed"); });
    ["pointerup","pointerleave","pointercancel"].forEach(function(ev){
      inner.addEventListener(ev,function(){ inner.classList.remove("pressed"); });
    });
    inner.addEventListener("pointermove",function(e){
      if(e.pointerType==="touch") return;
      var r=inner.getBoundingClientRect();
      inner.style.setProperty("--gx",((e.clientX-r.left)/r.width*100)+"%");
      inner.style.setProperty("--gy",((e.clientY-r.top)/r.height*100)+"%");
    });
  }

  function setBar(title,ctx){
    document.getElementById("barTitle").innerHTML="✈️ "+title;
    document.getElementById("barCtx").textContent = ctx||"";
  }

  /* ================= THEME ================= */
  function applyTheme(){ document.documentElement.setAttribute("data-theme",state.theme); }

  /* ================= ROUTER ================= */
  var RENDER={ planning:renderPlanning, calendrier:renderCalendrier, questions:renderQuestions,
               dashboard:renderDashboard, reglages:renderReglages, dailyquiz:renderDailyQuiz };
  function render(){
    renderTabbar();
    var host=document.getElementById("view");
    host.innerHTML="";
    (RENDER[state.tab]||renderPlanning)(host);
    window.scrollTo(0,0);
  }

  /* ================= PWA : installation ================= */
  var deferredPrompt=null;
  window.addEventListener("beforeinstallprompt",function(e){
    e.preventDefault(); deferredPrompt=e;
    var btn=document.getElementById("installBtn");
    if(btn) btn.style.display="";
  });
  function doInstall(){
    if(!deferredPrompt) return;
    deferredPrompt.prompt();
    deferredPrompt.userChoice.finally(function(){
      deferredPrompt=null;
      var btn=document.getElementById("installBtn"); if(btn) btn.style.display="none";
    });
  }
  function installText(){
    var ua=navigator.userAgent;
    var isIOS=/iPad|iPhone|iPod/.test(ua) || (navigator.platform==="MacIntel" && navigator.maxTouchPoints>1);
    if(isIOS) return "<b>iPad</b> — dans Safari : bouton <b>Partager</b> (carré + flèche) → <b>Sur l'écran d'accueil</b>. L'app s'ouvre en plein écran, et marche hors ligne.";
    return "<b>Mac</b> — Safari : menu <b>Fichier → Ajouter au Dock</b>. Chrome / Edge : icône <b>Installer</b> dans la barre d'adresse (ou le bouton ci-dessus).<br><b>iPad</b> — Safari : <b>Partager → Sur l'écran d'accueil</b>.";
  }

  /* ================= SYNCHRO Mac ↔ iPad (Supabase) ================= */
  var SYNC_CODE_KEY=KEY+"-sync-code";
  var SYNC_SEEN_KEY=KEY+"-sync-seen";
  var SUPABASE_URL="https://elyspjsyconovzczmzhm.supabase.co";
  var SUPABASE_KEY="sb_publishable_jpQmyTu3lkT65xw0Z6oXmg_7zxkqRXW";
  var SYNC_TABLE="bia_2027_state";
  var syncCode=""; try{ syncCode=localStorage.getItem(SYNC_CODE_KEY)||""; }catch(e){}
  var sb=(window.supabase&&window.supabase.createClient)?window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY):null;
  var syncMsg="";
  function setSyncMsg(t){ syncMsg=t; var e=document.getElementById("syncStatus"); if(e) e.textContent=t; }
  function genCode(){ var c="ABCDEFGHJKMNPQRSTUVWXYZ23456789",o=""; for(var i=0;i<6;i++) o+=c[Math.floor(Math.random()*c.length)]; return o; }
  var pushT=null;
  function schedulePush(){ if(!sb||!syncCode) return; clearTimeout(pushT); pushT=setTimeout(pushSync,900); }
  function pushSync(){
    if(!sb||!syncCode) return;
    setSyncMsg("Synchronisation…");
    sb.from(SYNC_TABLE).upsert({ code:syncCode, data:state }).select("updated_at").single().then(function(res){
      if(res.error){ setSyncMsg("Échec : "+res.error.message); return; }
      try{ localStorage.setItem(SYNC_SEEN_KEY,res.data.updated_at); }catch(e){}
      setSyncMsg("Synchronisé à l'instant");
    });
  }
  function pullSync(){
    if(!sb||!syncCode) return;
    setSyncMsg("Vérification…");
    sb.from(SYNC_TABLE).select("data, updated_at").eq("code",syncCode).maybeSingle().then(function(res){
      if(res.error){ setSyncMsg("Échec : "+res.error.message); return; }
      if(!res.data){ pushSync(); return; }
      var seen=null; try{ seen=localStorage.getItem(SYNC_SEEN_KEY); }catch(e){}
      if(res.data.updated_at!==seen){
        try{
          localStorage.setItem(KEY,JSON.stringify(res.data.data));
          localStorage.setItem(SYNC_SEEN_KEY,res.data.updated_at);
        }catch(e){}
        location.reload();
      } else setSyncMsg("À jour");
    });
  }
  function syncCreate(){
    if(!sb){ alert("Connexion indisponible (hors ligne ?)"); return; }
    syncCode=genCode();
    try{ localStorage.setItem(SYNC_CODE_KEY,syncCode); localStorage.removeItem(SYNC_SEEN_KEY); }catch(e){}
    render(); pushSync();
  }
  function syncLinkTo(code){
    code=(code||"").trim().toUpperCase();
    if(!code) return;
    syncCode=code;
    try{ localStorage.setItem(SYNC_CODE_KEY,syncCode); localStorage.removeItem(SYNC_SEEN_KEY); }catch(e){}
    render(); pullSync();
  }
  function syncUnlink(){
    if(!confirm("Délier cet appareil ? Il garde sa progression mais ne se synchronise plus.")) return;
    syncCode="";
    try{ localStorage.removeItem(SYNC_CODE_KEY); localStorage.removeItem(SYNC_SEEN_KEY); }catch(e){}
    render();
  }

  /* ================= NOTIFICATIONS : rappel du matin ================= */
  var VAPID_PUBLIC="BC791P1FqS-u4pPpbqvGyGswlPxHW7S4A8-ZwMFUQF2CLynoOv9934TRHboysRXmpmDmHMTKnfm6_9YlNXWbnaQ";
  function b64ToU8(s){
    var pad="=".repeat((4-s.length%4)%4), b=(s+pad).replace(/-/g,"+").replace(/_/g,"/");
    var raw=atob(b), a=new Uint8Array(raw.length);
    for(var i=0;i<raw.length;i++) a[i]=raw.charCodeAt(i);
    return a;
  }
  function isStandalone(){
    return (window.matchMedia && matchMedia("(display-mode: standalone)").matches) || navigator.standalone === true;
  }
  function pushSupported(){ return "serviceWorker" in navigator && "PushManager" in window && "Notification" in window; }

  var isTrueIOS = /iPad|iPhone|iPod/.test(navigator.userAgent) ||
    (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1 && !window.MSStream);
  function enableDailyReminder(cb){
    if(!pushSupported()){ cb("Cet appareil / navigateur ne gère pas les notifications web. Sur iPad il faut iPadOS 16.4 ou plus."); return; }
    if(isTrueIOS && !isStandalone()){ cb("Sur iPad : ouvre l’app depuis l’icône de l’écran d’accueil (pas l’onglet Safari), puis reviens ici."); return; }
    if(Notification.permission === "denied"){ cb("Les notifications sont bloquées pour ce site. Réactive-les : Réglages de l’appareil → l’app BIA 2027 → Notifications."); return; }
    Notification.requestPermission().then(function(perm){
      if(perm!=="granted"){ cb("Autorisation refusée. Tu peux la redonner dans les réglages de notifications de l’appareil."); return; }
      if(!syncCode){ syncCode=genCode(); try{ localStorage.setItem(SYNC_CODE_KEY,syncCode); localStorage.removeItem(SYNC_SEEN_KEY); }catch(e){} }
      navigator.serviceWorker.ready.then(function(reg){
        return reg.pushManager.getSubscription().then(function(existing){
          return existing || reg.pushManager.subscribe({ userVisibleOnly:true, applicationServerKey:b64ToU8(VAPID_PUBLIC) });
        });
      }).then(function(sub){
        var js=sub.toJSON();
        state.subs=(state.subs||[]).filter(function(s){ return s && s.endpoint!==js.endpoint; });
        state.subs.push(js);
        state.dailyOn=true;
        ensureDailyQuiz();
        try{ localStorage.setItem(KEY, JSON.stringify(state)); }catch(e){}
        if(sb && syncCode) pushSync();       // envoi immédiat vers Supabase (pas d'attente)
        cb(null);
      }).catch(function(e){ cb("Échec de l’abonnement : "+((e && e.message) || e)); });
    }).catch(function(e){ cb("Impossible de demander l’autorisation : "+((e && e.message) || e)); });
  }
  function disableDailyReminder(cb){
    state.dailyOn=false;
    if("serviceWorker" in navigator){
      navigator.serviceWorker.ready.then(function(reg){ return reg.pushManager.getSubscription(); })
        .then(function(sub){
          if(sub){ var ep=sub.endpoint; state.subs=(state.subs||[]).filter(function(s){ return s && s.endpoint!==ep; }); sub.unsubscribe().catch(function(){}); }
          save(); cb && cb();
        }).catch(function(){ save(); cb && cb(); });
    } else { save(); cb && cb(); }
  }

  applyTheme();
  try{ if(new URLSearchParams(location.search).get("quiz")){ state.tab="dailyquiz"; } }catch(e){}
  ensureDailyQuiz();
  render();
  if(syncCode) pullSync();
})();
</script>
<script>
if("serviceWorker" in navigator){
  window.addEventListener("load",function(){ navigator.serviceWorker.register("sw.js").catch(function(){}); });
}
</script>
</body>
